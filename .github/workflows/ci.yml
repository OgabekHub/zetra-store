name: CI

on:
  push:
    branches: [main]
  pull_request:

# Faqat o'qish huquqi: ish oqimi kodni o'qiydi, repoga hech narsa yozmaydi.
permissions:
  contents: read

# Bir tarmoqqa ketma-ket push qilinganda eski ishlar bekor qilinadi.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tekshiruv (tiplar, lint, i18n, testlar, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://zetra.uz
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint:eslint

      - name: Tarjimalar
        run: npm run i18n:check

      - name: Testlar va qamrov
        run: npm run test:coverage

      - name: Build
        run: npm run build

  audit:
    name: Paket zaifliklari
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Yuqori va kritik darajali zaiflik bo'lsa ish muvaffaqiyatsiz tugaydi.
      # Loyihada Next 16.2.6 dagi kritik RCE shu tekshiruv bilan topilgan edi.
      - name: npm audit
        run: npm audit --audit-level=high
